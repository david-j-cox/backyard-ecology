name: PUC Station Catch-up

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      stations:
        description: "Space-separated BirdWeather station IDs to catch up"
        required: true
        default: "18618 21974"
      from_date:
        description: "Start date, inclusive (YYYY-MM-DD)"
        required: false
      to_date:
        description: "End date, inclusive (YYYY-MM-DD)"
        required: false
      lookback_days:
        description: "Completeness-check lookback days"
        required: true
        default: "45"

permissions:
  contents: write

concurrency:
  group: "puc-station-catchup"
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          JAX_BIRDWX_API_KEY=${{ secrets.JAX_BIRDWX_API_KEY }}
          ESSEX_BIRDWX_API_KEY=${{ secrets.ESSEX_BIRDWX_API_KEY }}
          EOF

      - name: Download DuckDB from release
        run: |
          gh release download data \
            --pattern "backyard_ecology.duckdb" \
            --dir data/ --clobber \
            || echo "WARNING: No existing DB found, starting fresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download station PUC CSV from release
        run: |
          gh release download study-site-puc-data \
            --pattern "study_site_puc_data.csv" \
            --dir data/ --clobber \
            || echo "WARNING: No station PUC release data found, using git copy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run station catch-up
        working-directory: scripts_notebooks
        env:
          STATIONS: ${{ github.event.inputs.stations || '18618 21974' }}
          FROM_DATE: ${{ github.event.inputs.from_date || '' }}
          TO_DATE: ${{ github.event.inputs.to_date || '' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '45' }}
        run: |
          if [ -z "$FROM_DATE" ]; then
            FROM_DATE="$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)"
          fi
          if [ -z "$TO_DATE" ]; then
            TO_DATE="$(date -u +%F)"
          fi
          echo "Stations: $STATIONS"
          echo "Date range: $FROM_DATE to $TO_DATE"
          echo "Lookback days: $LOOKBACK_DAYS"
          python birdweather_specific_pucs.py \
            --stations $STATIONS \
            --from "$FROM_DATE" \
            --to "$TO_DATE" \
            --lookback "$LOOKBACK_DAYS"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puc-station-catchup-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload station PUC CSV to release
        run: |
          if [ ! -f data/study_site_puc_data.csv ]; then
            echo "No station PUC CSV to upload"
            exit 0
          fi
          gh release view study-site-puc-data >/dev/null 2>&1 \
            || gh release create study-site-puc-data \
              --title "Study-site PUC data" \
              --notes "Incremental BirdWeather station detections (managed outside git after exceeding GitHub's 100 MB file limit)"
          gh release upload study-site-puc-data data/study_site_puc_data.csv --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DuckDB to release
        if: always()
        run: |
          if [ ! -f data/backyard_ecology.duckdb ]; then
            echo "No DuckDB file to upload"
            exit 0
          fi
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "DuckDB data store" --notes "Pipeline database"
          gh release upload data data/backyard_ecology.duckdb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

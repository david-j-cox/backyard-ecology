name: Update Dashboard

on:
  schedule:
    # 6:30 AM ET every day (ET = UTC-5, so 11:30 UTC)
    # During daylight saving time (EDT = UTC-4), this runs at 7:30 AM ET
    - cron: '30 11 * * *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "dashboard-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          JAX_BIRDWX_API_KEY=${{ secrets.JAX_BIRDWX_API_KEY }}
          ESSEX_BIRDWX_API_KEY=${{ secrets.ESSEX_BIRDWX_API_KEY }}
          EOF

      - name: Download county BirdWeather data from release
        run: |
          gh release download county-birdweather \
            --pattern "county_level_birdweather.parquet" \
            --dir data/ --clobber \
            || echo "WARNING: No existing county BirdWeather data found, starting fresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download DuckDB from release
        run: |
          gh release download data \
            --pattern "backyard_ecology.duckdb" \
            --dir data/ --clobber \
            || echo "WARNING: No existing DB found, starting fresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download flyway heatmap from release
        run: |
          mkdir -p docs/dashboard_plots/interactive
          gh release download dashboard-assets \
            --pattern "all_flyways_total_birds.html" \
            --dir docs/dashboard_plots/interactive/ --clobber \
            || echo "WARNING: No existing flyway heatmap found, will generate fresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Phase 1 - Fetch data
        working-directory: scripts_notebooks
        run: |
          # DISABLED: OpenWeather API fetching is turned off to avoid OpenWeather
          # rate-limiting (HTTP 429) that was making thousands of calls and timing
          # out the run. Downstream Phase 2/3 plots that depend on weather (e.g.
          # visits by wind speed/temperature, species clustermap) continue to read
          # the existing committed data/hourly_weather.csv and data/sunrise_sunset.csv
          # from disk - they just won't refresh with new weather. To re-enable,
          # uncomment the three lines below and the matching `wait $PID_WEATHER` line.
          # echo "=== Fetching weather data ==="
          # python weather.py --hourly-output ../data/hourly_weather.csv --sunrise-output ../data/sunrise_sunset.csv &
          # PID_WEATHER=$!

          echo "=== Merging site data ==="
          python merge_sites_data.py &
          PID_MERGE=$!

          echo "=== Scraping BirdCast migration data ==="
          python birdcast_scraper.py &
          PID_BIRDCAST=$!

          echo "=== Scraping Atlantic Flyway ==="
          python atlantic_flyway_scraper.py &
          PID_ATLANTIC=$!

          echo "=== Scraping Mississippi Flyway ==="
          python mississippi_flyway_scraper.py &
          PID_MISSISSIPPI=$!

          echo "=== Scraping Pacific Flyway ==="
          python pacific_flyway_scraper.py &
          PID_PACIFIC=$!

          # Wait for all data scripts (don't fail the whole job if one errors)
          # PUC data (birdweather_specific_pucs.py, birdweather.py) is handled
          # by the separate puc-data-refresh workflow that runs earlier at 1 AM ET.
          # wait $PID_WEATHER || echo "WARNING: weather.py failed"  # DISABLED with weather fetch above
          wait $PID_MERGE || echo "WARNING: merge_sites_data.py failed"
          wait $PID_BIRDCAST || echo "WARNING: birdcast_scraper.py failed"
          wait $PID_ATLANTIC || echo "WARNING: atlantic_flyway_scraper.py failed"
          wait $PID_MISSISSIPPI || echo "WARNING: mississippi_flyway_scraper.py failed"
          wait $PID_PACIFIC || echo "WARNING: pacific_flyway_scraper.py failed"

          echo "=== Phase 1 complete ==="

      - name: Phase 2 - Run analytics
        working-directory: scripts_notebooks
        run: |
          echo "=== Running all-sites analytics ==="
          python all_sites_all_analytics.py

          echo "=== Running one-site analytics ==="
          python one_site_analytics.py

          echo "=== Generating flyway heatmap ==="
          python flyway_heatmap.py

          echo "=== Phase 2 complete ==="

      - name: Phase 3 - Generate dashboard HTML
        working-directory: scripts_notebooks
        run: python dashboard_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git reset -- docs/dashboard_plots/interactive/
          git reset -- data/flyway_heatmaps/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily dashboard update"
            # Retry pull --rebase + push to survive transient GitHub push
            # errors (e.g. "remote: fatal error in commit_refs"). Rebase each
            # attempt so a concurrent commit to main doesn't wedge us.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
            if [ "$pushed" != "true" ]; then
              echo "ERROR: all push attempts failed"
              exit 1
            fi
          fi

      - name: Upload county BirdWeather data to release
        if: always()
        run: |
          if [ ! -f data/county_level_birdweather.parquet ]; then
            echo "No county BirdWeather parquet to upload"
            exit 0
          fi
          gh release view county-birdweather >/dev/null 2>&1 \
            || gh release create county-birdweather \
              --title "County BirdWeather data" \
              --notes "Incremental county-level BirdWeather detection data (managed by CI pipeline)"
          gh release upload county-birdweather data/county_level_birdweather.parquet --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DuckDB to release
        if: always()
        run: |
          if [ ! -f data/backyard_ecology.duckdb ]; then
            echo "No DuckDB file to upload"
            exit 0
          fi
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "DuckDB data store" --notes "Pipeline database"
          gh release upload data data/backyard_ecology.duckdb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload flyway heatmap to release
        if: always()
        run: |
          if [ ! -f docs/dashboard_plots/interactive/all_flyways_total_birds.html ]; then
            echo "No flyway heatmap to upload"
            exit 0
          fi
          gh release view dashboard-assets >/dev/null 2>&1 \
            || gh release create dashboard-assets \
              --title "Dashboard interactive assets" \
              --notes "Large interactive HTML plots for the dashboard (managed by CI pipeline)"
          gh release upload dashboard-assets docs/dashboard_plots/interactive/all_flyways_total_birds.html --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to GitHub Pages (runs after update job)
  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Pull the commit we just pushed
          fetch-depth: 0

      - name: Pull latest
        run: git pull origin main

      - name: Download flyway heatmap for Pages deploy
        run: |
          mkdir -p docs/dashboard_plots/interactive
          gh release download dashboard-assets \
            --pattern "all_flyways_total_birds.html" \
            --dir docs/dashboard_plots/interactive/ --clobber \
            || echo "WARNING: No flyway heatmap found for Pages deploy"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      # GitHub Pages occasionally returns a transient "Deployment failed,
      # try again later." First attempt is allowed to fail; if it does, a
      # second attempt runs. Only if the retry also fails does the job fail.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
